# ─── pgdog.toml · identical on pgdog-a, pgdog-b, pgdog-c ───────────

[general]
host    = "0.0.0.0"
port    = 6432
workers = 16              # 2 per vCPU on an 8-core node

# ─ pool sizing: this × instances × nodes is your backend count ─
default_pool_size = 20
min_pool_size     = 5       # pre-opened; connect + TLS off the hot path
pooler_mode       = "transaction"

# ─ routing ─
read_write_split       = "include_primary_if_replica_banned"
read_write_strategy    = "conservative"   # explicit txns to primary
load_balancing_strategy = "least_active_connections"
query_parser           = "on"
prepared_statements    = "extended"
prepared_statements_limit  = 1_000
prepared_statements_ttl    = 300_000
prepared_statements_ttl_jitter = 30_000

# ─ health and bans ─
healthcheck_interval      = 30_000
idle_healthcheck_interval = 30_000
healthcheck_timeout       = 5_000
ban_timeout               = 300_000
ban_replica_lag           = 30_000       # DEFAULT: off
ban_replica_lag_bytes     = 104_857_600  # DEFAULT: off

# ─ bound every held connection ─
query_timeout       = 30_000       # DEFAULT: unlimited
client_idle_timeout = 300_000      # DEFAULT: unlimited
client_idle_in_transaction_timeout = 60_000
checkout_timeout = 5_000
connect_timeout  = 5_000
connect_attempts = 2
rollback_timeout = 5_000
idle_timeout     = 60_000
server_lifetime        = 3_600_000   # DEFAULT: 24h
server_lifetime_jitter = 300_000     # DEFAULT: 0

# ─ drain cleanly; both processes hold pools during a rollout ─
shutdown_timeout             = 60_000
shutdown_termination_timeout = 30_000

# ─ operate ─
healthcheck_port       = 6433        # DEFAULT: unset
openmetrics_port       = 9090        # DEFAULT: unset
openmetrics_namespace  = "pgdog_"
log_format             = "json"
log_level              = "info"
log_dedup_window       = 10_000      # incidents are noisy
log_dedup_threshold    = 5

# ─ transport ─
auth_type           = "scram"
tls_client_required = true
tls_certificate     = "/etc/pgdog/tls/tls.crt"
tls_private_key     = "/etc/pgdog/tls/tls.key"
tls_verify          = "verify-full"    # DEFAULT: disabled
tls_server_ca_certificate = "/etc/pgdog/tls/ca.crt"

[memory]
net_buffer     = 4096          # ×2 per socket — scales with client count
message_buffer = 4096

[tcp]
keepalive    = true
time         = 15_000
interval     = 5_000
retries      = 3
user_timeout = 30_000        # Linux only; kills half-open sockets

[admin]
name = "admin"
user = "pgdog_admin"

[[databases]]
name = "app"
host = "pg-primary.internal"
role = "primary"

[[databases]]
name = "app"
host = "pg-replica-b.internal"
role = "replica"

[[databases]]
name = "app"
host = "pg-replica-c.internal"
role = "replica"