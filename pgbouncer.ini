[databases]
app     = host=pg-primary port=5432 dbname=app user=app_svc pool_size=25
app_ro  = host=pg-replica port=5432 dbname=app user=app_svc pool_size=25
reports = host=pg-replica port=5432 dbname=app user=report_svc pool_size=10 pool_mode=session

[peers]
1 = host=/run/pgbouncer/1
2 = host=/run/pgbouncer/2
3 = host=/run/pgbouncer/3
4 = host=/run/pgbouncer/4

[pgbouncer]
; --- identity (DIFFERS per process) ---
peer_id = 1
unix_socket_dir = /run/pgbouncer/1
pidfile = /run/pgbouncer/1/pgbouncer.pid
logfile = /var/log/pgbouncer/1.log

; --- listeners ---
listen_addr = 0.0.0.0
listen_port = 6432
listen_backlog = 4096
so_reuseport = 1
tcp_defer_accept = 1

; --- pooling ---
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_prepared_statements = 200
server_round_robin = 0

; --- timeouts (seconds) ---
client_login_timeout = 60
query_wait_timeout = 120
query_wait_notify = 5
idle_transaction_timeout = 600
cancel_wait_timeout = 10
server_connect_timeout = 15
server_login_retry = 15
server_lifetime = 3600
server_idle_timeout = 600
server_check_delay = 30
suspend_timeout = 10

; --- sockets ---
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6
tcp_user_timeout = 30000
pkt_buf = 4096
sbuf_loopcnt = 5

; --- auth ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT * FROM pgbouncer.get_auth($1)
ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1

; --- tls ---
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_protocols = secure
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/tls/ca.crt
server_tls_protocols = secure

; --- observability ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0
admin_users = pgbouncer_admin
stats_users = monitoring